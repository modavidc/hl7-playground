name: Feature request
description: Suggest an improvement to HL7 Playground.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the task or limitation you ran into.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: Describe the behavior or improvement you have in mind.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: Add examples using synthetic data only. Do not include real patient messages or identifying information.
