name: Bug report
description: Report a reproducible problem in HL7 Playground.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Please use synthetic data only. Do not include real patient messages or identifying information."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem you encountered.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps that reproduce the problem.
      placeholder: |
        1. Open the demo
        2. Paste a synthetic HL7 v2 message
        3. Select Parse message
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Sanitized sample (optional)
      description: Use synthetic HL7 only. Do not paste real messages, even after removing obvious identifiers.
      render: text
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Firefox 132 on Windows 11
